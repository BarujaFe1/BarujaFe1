name: Refresh profile assets

on:
  # Scheduled workflows run on the default branch after this PR is merged.
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test generators
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate cards
        # Optional token affects API reads only; checkout/push uses GITHUB_TOKEN.
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: python3 tools/profile_assets.py
      - name: Commit changed cards to the selected branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add assets/stats.svg assets/featured-dataflow.svg
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(profile): refresh generated cards"
          # Reject concurrent branch changes instead of overwriting them.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
